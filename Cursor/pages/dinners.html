<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dinners | Maxxed Out Recipes</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8f8f8;
            margin: 0;
            padding: 0;
        }
        header {
            background: #ff7043;
            color: white;
            padding: 2.2rem 0 1.5rem 0;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            position: relative;
        }
        .home-btn {
            position: absolute;
            top: 24px;
            left: 24px;
            background: #fff;
            color: #ff7043;
            border: 2px solid #ff7043;
            border-radius: 8px;
            padding: 0.5rem 1.2rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            z-index: 10;
            transition: background 0.15s, color 0.15s;
        }
        .home-btn:hover {
            background: #ff7043;
            color: #fff;
        }
        .main-title {
            font-size: 2.2rem;
            font-weight: bold;
            margin: 0;
            text-align: center;
            color: #fff;
        }
        .dinners-container {
            max-width: 900px;
            margin: 2.5rem auto 2rem auto;
            padding: 0 1rem;
        }
        .category-section {
            margin-bottom: 3rem;
        }
        .category-section:last-child {
            margin-bottom: 0;
        }
        .category-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ff7043;
            margin: 0 0 1.25rem 0;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #ffd7c9;
            text-align: center;
        }
        .recipes {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            justify-content: center;
        }
        .recipe-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            width: 280px;
            padding: 1.5rem 1rem 1rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s;
            cursor: pointer;
        }
        .recipe-card:hover {
            transform: translateY(-5px) scale(1.03);
        }
        .recipe-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
            background: #eee;
            margin-bottom: 1rem;
        }
        .recipe-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: #ff7043;
            text-align: center;
        }
        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0.7rem 0 0.2rem 0;
            color: #333;
        }
        ul, ol {
            margin: 0 0 0.7rem 1.2rem;
            padding: 0;
        }
        /* Modal styles */
        .modal-bg {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.25);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-bg.active {
            display: flex;
        }
        .modal {
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 4px 32px rgba(0,0,0,0.18);
            padding: 2.5rem 2rem 2rem 2rem;
            min-width: 340px;
            min-height: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ff7043;
            margin-bottom: 2rem;
        }
        .modal-options {
            display: flex;
            gap: 2rem;
        }
        .modal-option {
            background: #fafafa;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            width: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding-bottom: 1rem;
            border: 2px solid transparent;
            transition: border 0.15s, box-shadow 0.15s;
        }
        .modal-option:hover:not(.current) {
            border: 2px solid #ff7043;
            box-shadow: 0 4px 16px rgba(255,112,67,0.13);
        }
        .modal-option.current {
            border: 2px solid #ff7043;
            background: #fff3ed;
            cursor: default;
            opacity: 0.85;
        }
        .modal-img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 12px 12px 0 0;
            background: #eee;
        }
        .modal-label {
            font-size: 1.15rem;
            font-weight: 600;
            color: #ff7043;
            margin: 1rem 0 0.5rem 0;
            text-align: center;
        }
        .modal-desc {
            font-size: 0.98rem;
            color: #444;
            text-align: center;
            margin: 0 0.7rem 0.7rem 0.7rem;
        }
        @media (max-width: 800px) {
            header {
                padding: 1.5rem 0 1rem 0;
            }
            .home-btn {
                top: 16px;
                left: 16px;
                padding: 0.4rem 1rem;
                font-size: 1rem;
            }
            .main-title {
                font-size: 1.8rem;
            }
            .dinners-container {
                margin: 1.5rem auto 1rem auto;
                padding: 0 0.5rem;
            }
            .category-title {
                font-size: 1.3rem;
                margin-bottom: 1rem;
            }
            .category-section {
                margin-bottom: 2rem;
            }
            .recipes {
                flex-direction: column;
                align-items: center;
                gap: 1.5rem;
            }
            .recipe-card {
                width: 100%;
                max-width: 400px;
            }
            .modal {
                min-width: 90%;
                max-width: 90%;
                padding: 1.5rem 1rem;
            }
            .modal-title {
                font-size: 1.3rem;
                margin-bottom: 1.5rem;
            }
            .modal-options {
                flex-direction: column;
                gap: 1.2rem;
            }
            .modal-option {
                width: 100%;
            }
        }
        
        @media (max-width: 600px) {
            .home-btn {
                top: 12px;
                left: 12px;
                padding: 0.35rem 0.8rem;
                font-size: 0.9rem;
            }
            .main-title {
                font-size: 1.5rem;
            }
            .dinners-container {
                margin: 1rem auto;
                padding: 0 0.5rem;
            }
            .category-title {
                font-size: 1.15rem;
            }
            .recipes {
                gap: 1rem;
            }
            .recipe-card {
                padding: 1rem;
                max-width: 100%;
            }
            .recipe-img {
                height: 140px;
            }
            .recipe-title {
                font-size: 1.1rem;
            }
            .section-title {
                font-size: 1rem;
            }
            ul, ol {
                font-size: 0.9rem;
            }
        }
        
        @media (max-width: 400px) {
            .main-title {
                font-size: 1.3rem;
            }
            .recipe-card {
                padding: 0.75rem;
            }
            .modal {
                min-width: 95%;
                max-width: 95%;
                padding: 1rem 0.75rem;
            }
        }
    </style>
</head>
<body>

        const categoryOrder = ["Pasta", "Beef Based", "Chicken Based", "Fish Based", "Stews"];

        function renderRecipes() {
            const container = document.getElementById('recipes');
            container.innerHTML = '';

            categoryOrder.forEach(category => {
                const categoryRecipes = recipes.filter(r => r.category === category);
                if (categoryRecipes.length === 0) return;

                const section = document.createElement('div');
                section.className = 'category-section';

                const heading = document.createElement('div');
                heading.className = 'category-title';
                heading.textContent = category;
                section.appendChild(heading);

                const row = document.createElement('div');
                row.className = 'recipes';

                categoryRecipes.forEach(recipe => {
                    const card = document.createElement('div');
                    card.className = 'recipe-card';
                    card.onclick = () => goToRecipe(recipe.title);
                    card.innerHTML = `
                        <img class="recipe-img" src="${recipe.image}" alt="${recipe.title}">
                        <div class="recipe-title">${recipe.title}</div>
                        <div class="section-title">Ingredients:</div>
                        <ul>
                            ${recipe.ingredients.map(ing => `<li>${ing}</li>`).join('')}
                        </ul>
                        <div class="section-title">Steps:</div>
                        <ol>
                            ${recipe.steps.map(step => `<li>${step}</li>`).join('')}
                        </ol>
                    `;
                    row.appendChild(card);
                });

                section.appendChild(row);
                container.appendChild(section);
            });
        }
        function goToRecipe(recipeTitle) {
            // Convert recipe title to a filename-friendly format
            const filename = '../recipes/rec_dinner_' + recipeTitle.toLowerCase().replace(/[^a-z0-9]/g, '_') + '.html';
            window.location.href = filename;
        }
        renderRecipes();

</html>
